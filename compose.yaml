name: weather-stream

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weather}
      POSTGRES_DB: ${POSTGRES_DB:-weather}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - weather_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  server:
    build:
      context: ./source
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://weather:weather@db:5432/weather}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173","http://localhost:8080"]}'
      TCP_HOST: 0.0.0.0
      TCP_PORT: 9000
      ENABLE_TCP: "true"
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-30}
      WEATHER_SOURCE: ${WEATHER_SOURCE:-provider}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
      - "127.0.0.1:${TCP_PORT:-9000}:9000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
  client:
    build: ./source/client
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
  db-init:
    build:
      context: ./source
      dockerfile: server/Dockerfile
    profiles: [setup]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://weather:weather@db:5432/weather}
      SPRING_PROFILES_ACTIVE: init-db
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      ENABLE_TCP: "false"
    depends_on:
      db:
        condition: service_healthy
  collector:
    build:
      context: ./source
      dockerfile: server/Dockerfile
    profiles: [live]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://weather:weather@db:5432/weather}
      SPRING_PROFILES_ACTIVE: collector
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      ENABLE_TCP: "false"
      TCP_PORT: 9000
      COLLECTOR_HOST: server
      COLLECTOR_WARD_IDS: ${COLLECTOR_WARD_IDS-00004}
      COLLECTOR_ALL_WARDS: ${COLLECTOR_ALL_WARDS:-false}
      COLLECTOR_MAX_PENDING: ${COLLECTOR_MAX_PENDING:-10000}
      COLLECTOR_OUTBOX: /home/weather/.collector/outbox
    volumes:
      - collector_state:/home/weather/.collector
    depends_on:
      server:
        condition: service_healthy
  simulator:
    image: python:3.12-slim
    profiles: [demo]
    volumes:
      - ./source/scripts:/scripts:ro
    command: ["python", "/scripts/publish_weather.py", "--host", "server", "--ward-id", "00004"]
    depends_on:
      server:
        condition: service_healthy
volumes:
  weather_data:
  collector_state:
