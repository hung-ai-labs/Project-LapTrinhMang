# Weather Stream - cau hinh ung dung
# Gia tri that doc tu file .env o thu muc source/server (xem spring.config.import)

# --- Server ---
# One port serves everything: React build, REST API and Swagger.
server.port=${API_PORT:8000}
# Dev reads source/client/dist directly, so `npm run build` shows up without repacking the jar.
# A packaged jar has no such directory and falls through to the copy bundled inside it.
spring.web.resources.static-locations=${STATIC_LOCATIONS:file:../client/dist/,file:source/client/dist/,classpath:/static/}

# --- Spring core ---
spring.application.name=weather-stream
# Read relative to the working directory. The second entry covers IDE run configurations that
# default to the repository root instead of source/server; whichever file is absent is skipped.
spring.config.import=optional:file:.env[.properties],optional:file:source/server/.env[.properties]
spring.task.scheduling.pool.size=4

# --- Jackson: JSON tra ve dung snake_case, ngay gio dang ISO ---
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.serialization.write-dates-as-timestamps=false

# --- JPA / Hibernate: khong tu chay DDL, luu UTC ---
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jakarta.persistence.query.timeout=10000
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

# --- Swagger UI ---
springdoc.swagger-ui.path=/docs

# --- Cau hinh rieng cua du an ---
weather.database-url=${DATABASE_URL:postgresql://weather:weather@localhost:5433/weather}
weather.database-user=${DB_USER:}
weather.database-password=${DB_PASSWORD:}
weather.jwt-secret=${JWT_SECRET:}
weather.jwt-expire-minutes=${JWT_EXPIRE_MINUTES:30}
weather.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:8080,http://127.0.0.1:8080}
weather.source=${WEATHER_SOURCE:provider}
weather.tcp-host=${TCP_HOST:127.0.0.1}
weather.tcp-port=${TCP_PORT:9000}
weather.enable-tcp=${ENABLE_TCP:true}
weather.open-meteo-url=https://api.open-meteo.com/v1/forecast
# Separate Open-Meteo host: UV index and air quality, no API key required
weather.air-quality-url=${AIR_QUALITY_URL:https://air-quality-api.open-meteo.com/v1/air-quality}

# --- Chatbot Gemini + RAG ---
weather.gemini-api-key=${GEMINI_API_KEY:}
weather.gemini-base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
weather.gemini-model=${GEMINI_MODEL:gemini-3.8-flash}
# Tried in order when the primary model is retired (404) or saturated (503). The tail is
# deliberately older and lighter: the newest flash models are the ones that return 503 under load,
# so the chain needs candidates that are still serving when they are not.
# Kept short on purpose: every saturated candidate costs a probe, and the whole chain has to finish
# inside the request budget, so a long list would time out before reaching a model that answers.
weather.gemini-fallback-models=${GEMINI_FALLBACK_MODELS:gemini-3.7-flash,gemini-3.5-flash,gemini-3.1-flash-lite,gemini-flash-latest}
weather.gemini-embed-model=${GEMINI_EMBED_MODEL:gemini-embedding-001}
weather.gemini-embed-dimensions=${GEMINI_EMBED_DIMENSIONS:768}
weather.chat-history-turns=${CHAT_HISTORY_TURNS:12}
weather.chat-rate-limit-per-minute=${CHAT_RATE_LIMIT_PER_MINUTE:10}
weather.rag-top-k=${RAG_TOP_K:5}
weather.rag-min-score=${RAG_MIN_SCORE:0.45}
# Relative to the working directory; both spellings are listed so index-docs works whether it runs
# from source/server or from the repository root. Missing roots are skipped with a warning.
weather.rag-doc-roots=${RAG_DOC_ROOTS:../../reports,../../source/ml,../../docs,reports,source/ml,docs}
