name: weather-loadtest
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: loadtest-local-only
      POSTGRES_DB: weather
    healthcheck:
      test: [CMD-SHELL, pg_isready -U weather -d weather]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - loadtest_data:/var/lib/postgresql/data
  server:
    build: ../server
    environment:
      DATABASE_URL: postgresql+psycopg://weather:loadtest-local-only@db:5432/weather
      WEATHER_SOURCE: simulator
      JWT_SECRET: local-loadtest-only-secret-at-least-32-characters
      TCP_HOST: 0.0.0.0
      PYTHONPATH: /app
    ports:
      - "127.0.0.1:18000:8000"
      - "127.0.0.1:19000:9000"
    volumes:
      - ../scripts:/source/scripts:ro
      - ../data:/source/data:ro
      - .:/load-tests:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 3s
      timeout: 5s
      retries: 60
  client:
    build: ../client
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      server:
        condition: service_healthy
  simulator:
    image: python:3.12-slim
    profiles: [stream]
    volumes:
      - ../scripts:/scripts:ro
    command: [python, /scripts/publish_weather.py, --host, server, --ward-id, '00004', --interval, '1']
    depends_on:
      server:
        condition: service_healthy
volumes:
  loadtest_data:
