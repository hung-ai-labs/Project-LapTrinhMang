name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: weather
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: weather_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U weather -d weather_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: source/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: source/server/pom.xml
      - run: mvn -B verify
      - run: >-
          mvn -B -Dtest=ApiIntegrationTest
          -Dweather.database-url=jdbc:postgresql://localhost:5432/weather_ci
          -Dweather.database-user=weather -Dweather.database-password=local-ci-only
          -Dspring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  compose:
    env:
      WEATHER_SOURCE: simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up -d db
      - run: docker compose --profile setup run --build --rm db-init
      - run: docker compose --profile demo up --build -d --wait server client simulator
      - run: |
          python - <<'PYCODE'
          import json, time, urllib.request
          for attempt in range(30):
              with urllib.request.urlopen('http://localhost:8000/api/v1/wards/00004/weather/history') as response:
                  if json.load(response)['data']['results']:
                      break
              time.sleep(1)
          else:
              raise SystemExit('No observation received from TCP simulator')
          urllib.request.urlopen('http://localhost:8080')
          PYCODE
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose --profile demo down -v
