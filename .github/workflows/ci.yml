name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: source/server/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/client/package-lock.json
      - run: npm ci
      - run: npm run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose --profile demo up --build -d --wait
      - run: |
          python - <<'PYCODE'
          import json, time, urllib.request
          for attempt in range(30):
              with urllib.request.urlopen('http://localhost:8000/api/v1/weather/hanoi/history') as response:
                  if json.load(response):
                      break
              time.sleep(1)
          else:
              raise SystemExit('No observation received from TCP simulator')
          urllib.request.urlopen('http://localhost:8080')
          PYCODE
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose --profile demo down -v
